<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | NPO法人タダカヨ</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/images/tadakayo_logo.png">
  <!-- Noto Sans JP（自己ホスト・Pマーク: Google CDN非経由）。Firebase 標準の 404 は Google Fonts を CDN から読むため置き換える -->
  <style>
    @font-face {
      font-family: 'Noto Sans JP';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/NotoSansJP-subset.woff2') format('woff2');
    }
  </style>
<style>
:root{--red:#C62828;--red-d:#c02828;--pink:#FFE4EC;--ink:#1a1a1a;--muted:#555;--line:#e4e4e4;--bg2:#F5F5F5}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:#fff;line-height:1.8;font-size:16px}
a{color:#1f5f9e}.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);background:#fff}
header .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;white-space:nowrap}.brand img{height:36px;width:auto}
h1{font-size:28px;line-height:1.4;margin:48px 0 8px}
.lead{color:var(--muted);margin:0 0 24px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:10px;text-decoration:none;font-weight:700;border:2px solid var(--red-d)}
.btn-p{background:var(--red-d);color:#fff}.btn-o{background:#fff;color:var(--red-d)}
footer{margin-top:56px;border-top:1px solid var(--line);background:var(--bg2);padding:24px 0;font-size:14px;color:var(--muted)}
@media(max-width:640px){h1{font-size:23px}.brand{font-size:15px}.brand img{height:30px}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/"><img src="/images/tadakayo_logo.png" alt="タダカヨ" width="378" height="378">介護情報基盤伴走支援</a></div></header>
<main class="wrap">
<h1>ページが見つかりません</h1>
<p class="lead">お探しのページは、移動または削除された可能性があります。URLをお確かめのうえ、トップページからお探しください。</p>
<div class="btns">
<a class="btn btn-p" href="/">トップページへ</a>
<a class="btn btn-o" href="/library">資料・動画</a>
<a class="btn btn-o" href="/#contact">相談する</a>
</div>
</main>
<footer><div class="wrap">
<p>© 2026 NPO法人タダカヨ</p>
</div></footer>
</body>
</html>
