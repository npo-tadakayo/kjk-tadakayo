<script>
const MD="# 介護情報基盤CRM 業務フロー図（2026-10-21 現在のコードと運用）\n\n**位置づけ**: CRM（`kjk-tadakayo`）の実装を読んで起こした「実際の動き」の図。正本はこの Markdown（Mermaid）。見やすい版は `CRM業務フロー図_20261021.html`。\n**根拠**: functions/index.js・admin/js/*・firestore.rules・MANUAL.md・docs/出荷の二段階化_設計_20261020.md を読み取り（4分野を並行調査→突き合わせ）。コードに無い運用は「運用」と明記。**実装済みと未実装は区別**する。\n**前提**: 出荷の二段階化（案B）は**未実装**。図Dの「現状」が今の動き、図D'が設計。\n\n## 凡例（色と形）\n\n| 見た目 | 意味 |\n|---|---|\n| 黄色の四角 | **人が入力・操作する** |\n| 橙色のひし形 | **人が確認・判断する**（システムは止めない・強制しない） |\n| 青色の四角 | **システムが自動でやる** |\n| 灰色の四角 | 外部の人・サービス（事業所・Chat・Gmail・ABサークル） |\n| 赤い点線の四角 | **コードに無い／運用に任されている／未実装**（人の記憶と声かけが頼り） |\n\n```mermaid\nflowchart LR\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n  H[\"人が入力・操作\"]:::human\n  C{\"人が確認・判断\"}:::check\n  A[\"システムが自動\"]:::auto\n  E[\"外部（事業所・Chat・Gmail）\"]:::ext\n  G[\"運用／未実装\"]:::gap\n```\n\n---\n\n## 図0. 全体（受付から案件完了まで）\n\n案件のステータス（1〜13）を背骨に、並行して動く「出荷・請求・入金」の流れを右に置く。\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  subgraph IN[\"入口（案件ができる）\"]\n    I1[\"事業所: LP問い合わせ<br/>lp_inquiry\"]:::ext\n    I2[\"事業所: 見積ページ<br/>mitsumori_quote\"]:::ext\n    I3[\"事務局: 電話・メールを受けて手入力<br/>manual\"]:::human\n  end\n  I1 --> S1\n  I2 --> S2\n  I3 --> S1\n  S1[\"状態1 新規受信（担当なし）\"]:::auto\n  S2[\"状態2 確認中\"]:::auto\n  S1 --> F1{\"事務局: 初期連絡<br/>5営業日以内（画面表示のみ）\"}:::check\n  F1 --> S2\n  S2 --> Q[\"見積もり作成・送付<br/>（図A）\"]:::human\n  Q --> AC[\"事業所: ウェブで申込（承諾）\"]:::ext\n  AC --> S3[\"状態3 受注確定<br/>自動: 出荷の下書き作成\"]:::auto\n  S3 --> AS{\"担当決定（Chatで調整→CRMの担当欄）<br/>図B\"}:::check\n  AS --> S5[\"状態5 担当者決定\"]:::human\n  S5 --> CO[\"承諾書の署名・事前準備のご案内<br/>図B\"]:::human\n  CO --> S6[\"状態6 事前準備中（訪問日を入力）\"]:::human\n  S6 --> S7[\"状態7 伴走支援待ち\"]:::human\n  S7 --> S8[\"状態8 伴走支援実施済<br/>図C\"]:::human\n  S8 --> S9[\"状態9 書類準備完了・申請ガイド中\"]:::human\n  S9 --> S10[\"状態10 申請完了・採択待ち\"]:::human\n  S10 --> S11[\"状態11 採択・入金待ち\"]:::human\n  S11 --> S12[\"状態12 アフターフォロー\"]:::human\n  S12 --> S13{\"状態13 案件完了<br/>（出荷が入金済か等のチェックはコードに無い）\"}:::gap\n\n  S3 -. 出荷の下書き .-> SH\n  subgraph SP[\"出荷・請求・入金（供給管理）図D\"]\n    SH[\"出荷 下書き\"]:::auto --> SH2{\"人: 在庫から／ABサークルを判断<br/>「発送済にする」\"}:::check\n    SH2 --> SH3[\"発送済 → 請求済 → 入金済 → 領収証\"]:::human\n  end\n  S12 -. 出荷が済んでいるか確認 .-> SH3\n\n  LOST[\"失注(4)<br/>どの段階でも手動・理由が必須\"]:::human\n  S2 -.-> LOST\n  S5 -.-> LOST\n```\n\n**全体の注意（コードで確認できたこと）**\n- ステータスの移動は**ほぼすべて手動**。順序制限も前提条件のチェックも無い（任意の状態へ動かせる）。**自動で動くのは 1→2（見積作成）と →3（事業所の申込）だけ**。\n- 案件ステータス・申請ステータス（subsidyApplications）・出荷の状態（shipments）は**互いに連動しない**。\n- 担当を自動で割り当てる処理は、どの入口にも無い（案件は必ず担当なしで作られる）。\n\n---\n\n## 図A. 入口〜見積もり〜申込（受注確定）\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  subgraph LP[\"入口1: LP問い合わせ\"]\n    L1[\"事業所: フォーム送信<br/>ご希望=相談／見積／申込\"]:::ext\n    L1 --> L2{\"同じメール＋同じ事業所名で<br/>動いている案件がある?\"}:::auto\n    L2 -- はい --> L3[\"その案件に追記<br/>（活動・ご希望を更新）\"]:::auto\n    L2 -- いいえ --> L4[\"案件を新規作成 状態1・担当なし<br/>事業所マスタも作成\"]:::auto\n    L1 --> L5{\"5分以内の同内容?\"}:::auto\n    L5 -- はい --> L6[\"重複として捨てる\"]:::auto\n  end\n  L3 --> N1\n  L4 --> N1\n  N1[\"自動: Chat（CRM通知）に投稿<br/>自動: 事務局あてメール\"]:::auto\n\n  subgraph MI[\"入口2: 見積ページ（1〜10事業所）\"]\n    M1[\"事業所: 見積を作る\"]:::ext\n    M1 --> M2[\"自動: 案件作成 状態2（既存の状態1は2へ）<br/>見積 EST-年-連番・有効30日・issued\"]:::auto\n    M2 --> M3[\"自動: PDF保存→事業所へGmail（CC事務局）\"]:::auto\n    M2 --> M4[\"Chat通知は設定の notifyQuoteChat が真のときだけ<br/>（既定は通知しない）\"]:::gap\n  end\n\n  subgraph MA[\"入口3: 手入力\"]\n    H1[\"事務局: 電話・メールを受けて<br/>案件の新規登録（事業所名のみ必須）\"]:::human\n    H1 --> H2[\"案件 状態1・担当なし<br/>Chat・メールは出ない\"]:::auto\n  end\n\n  N1 --> T{\"事務局: 初期連絡<br/>申込から5営業日以内\"}:::check\n  H2 --> T\n  T --> T2[\"電話・メールで確認 → 対応記録を手で追加<br/>状態を2にする（手動）\"]:::human\n  T -. 超過は画面に赤バッジ「超過N日」。通知は出ない .-> T3[\"期限の解除は状態が1のままかだけで判定<br/>連絡した記録では解除されない\"]:::gap\n\n  T2 --> V1[\"見積もり作成<br/>スタッフ: 案件の見積カード（staffCreateQuote）<br/>金額はサーバが再計算\"]:::human\n  M3 --> V2\n  V1 --> V2[\"見積書を事業所へ送付／再送<br/>PDFが無いと送れない\"]:::human\n  V2 --> V3{\"内容を変えるか?\"}:::check\n  V3 -- はい --> V4[\"改版（reviseQuote）理由必須<br/>出荷が下書きのときだけ可・明細を作り直す<br/>旧版は superseded\"]:::human\n  V4 --> V2\n  V3 -- いいえ --> AC1\n\n  subgraph AC[\"承諾＝申込\"]\n    AC1[\"事業所: 見積ページで『申し込む』<br/>署名名・規約同意・届け先を入力\"]:::ext\n    AC1 --> AC2{\"有効期限内かつ issued?\"}:::auto\n    AC2 -- いいえ --> AC3[\"拒否\"]:::auto\n    AC2 -- はい --> AC4[\"自動（1回の処理で）:<br/>出荷の下書き SH-年-連番 を作る（在庫扱い）<br/>見積を accepted・案件を状態3<br/>活動を記録\"]:::auto\n    AC4 --> AC5[\"自動: 確認メール（CC事務局）<br/>自動: Chat『在庫から発送かABサークルへ発注を選んで』\"]:::auto\n  end\n  AC5 --> Z[\"→ 図B 担当決定へ\"]:::auto\n\n  ALT[\"電話・メールで受けた申込を受注確定にする操作は<br/>専用ボタンが無い（状態を手動で3にする運用）<br/>このとき出荷の下書きも作られない\"]:::gap\n  T2 -.-> ALT\n```\n\n---\n\n## 図B. 担当決定〜承諾書〜事前準備\n\n実際の運用では、担当は**Googleチャットでお願い・調整してから**CRMに入れている。CRMは担当に何も通知しない。\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  A0[\"状態3 受注確定（担当なし）\"]:::auto\n  A0 --> N[\"ホーム『担当営業が決まっていない案件』に出る<br/>毎朝9時のChatまとめには状態1のみ入る\"]:::auto\n  N --> D1{\"次田さん／事務局: 誰に頼むか判断<br/>場所・持ち件数・過去の担当\"}:::check\n  D1 --> D2[\"Chat（TM_介護情報基盤普及推進室 など）で<br/>候補者に依頼・日程調整（スレッド）\"]:::gap\n  D2 --> D3{\"候補者: 引き受けるか返答\"}:::check\n  D3 -- はい --> D4[\"案件詳細『担当営業』を選ぶと即保存<br/>活動に『担当営業変更』を自動記録\"]:::human\n  D3 -- いいえ --> D1\n  D4 --> D5[\"担当者への通知は無い<br/>気づく手段=ホームの『自分の分』／一覧・カンバンの絞り込み\"]:::gap\n  D4 --> D6[\"状態を手で 5『担当者決定』へ<br/>（担当を決めても状態は自動で動かない）\"]:::human\n\n  D6 --> K1{\"承諾書の署名（伴走支援を始める前の決まり）<br/>コード上のゲートは無い\"}:::gap\n  K1 --> K2[\"担当営業: 事前確認タブで『署名を依頼する』\"]:::human\n  K2 --> K3[\"渡し方: メール／二次元バーコード／URLコピー<br/>条文全文（現行1.1）をその時点で焼き込む\"]:::human\n  K3 --> K4[\"事業所の確認者: consent.html（ログイン不要）<br/>名前入力・チェック→署名（web）\"]:::ext\n  K2 --> K5[\"紙で取得した場合: 『紙で取得済みを記録』<br/>確認者名・署名日（paper）。原本の保管はCRM外\"]:::human\n  K4 --> K6{\"署名済みか?: 職員がカードを開いて目視<br/>署名完了の通知も自動PDF送付も無い\"}:::gap\n  K5 --> K6\n\n  D6 --> P1[\"担当営業: 事前準備のご案内メール（8項目）<br/>宛先・件名・本文を編集して送信<br/>KJ ID・パスワード・セキュリティメール・電子証明書<br/>ネット環境・PC・カードリーダー・助成金の意向\"]:::human\n  P1 --> P2[\"送ると preGuideMailedAt を保存<br/>カードが『送付済み＋日付』に変わる\"]:::auto\n  P1 --> P3[\"担当営業: 事前確認チェックリスト<br/>各項目 未確認／○／△／×＋メモ\"]:::human\n  P3 --> P4[\"担当営業: 訪問予定日を入力し<br/>状態を 6『事前準備中』→日程が決まれば 7『伴走支援待ち』へ手動\"]:::human\n```\n\n---\n\n## 図C. 伴走支援（当日）〜書類〜申請〜採択〜アフター〜完了\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  S7[\"状態7 伴走支援待ち<br/>ホームに『伴走支援待ち』が出る\"]:::auto\n  S7 --> E1[\"伴走支援者（担当営業が兼ねる）: 当日<br/>当日チェックリスト: 初回利用登録→電子証明書→マイナアプリ<br/>→CR接続→介護WEB設定→動作確認→利用者周知<br/>写真をStorageに保存\"]:::human\n  E1 --> E2{\"個人情報の取扱い3項目を確認<br/>目的のみ・パスワード等を記録しない・持ち出さない\"}:::check\n  E2 --> E3[\"『実施の記録』: 実施日・実施者・区分<br/>（単独／トレーニング／見学）。トレーニングはトレーナー必須\"]:::human\n  E3 --> E4[\"トレーニングの場合: 評価（8観点・OJT合否）<br/>独り立ち可ならトレーナーがバッジを付与\"]:::human\n  E1 --> E5[\"伴走支援セッション記録（日付・メモ・写真）<br/>AIアシスタントで報告文の下書き（Vertex AI）\"]:::human\n  E3 --> S8[\"状態を 8『伴走支援実施済』へ手動\"]:::human\n\n  S8 --> D1[\"書類チェックタブ（6項目）<br/>通帳の写し・サービス種類確認資料・領収証（型名・用途）<br/>介護WEBサービス管理メニュー画面コピー<br/>マイナ対応CR確認済・ポータルアカウント取得済\"]:::human\n  D1 --> D2{\"全部そろったか: 職員が確認<br/>チェックしても状態は自動で変わらない\"}:::gap\n  D2 --> S9[\"状態を 9『書類準備完了・申請ガイド中』へ手動\"]:::human\n  S9 --> D3[\"申請ガイド（令和8年度の手引き画像引用・A4・8頁）<br/>は請求書・領収証メール送信時に任意で同封<br/>領収証の金額A・Bを差し込む。同封は職員が判断\"]:::check\n\n  D3 --> AP1[\"事業所: 助成金の申請（申請の主体は事業所）<br/>タダカヨは手続きを支援し代行しない\"]:::ext\n  AP1 --> AP2[\"担当営業: 『申請情報』タブに入力<br/>申請ステータス・申請日・決定通知書受信日<br/>振込確認日・交付額・カードリーダー購入費A・接続サポート費B・不採択理由\"]:::human\n  AP2 --> AP3[\"自動表示: 振込予定日（申請月の翌々月末）<br/>ホームに申請期限までの残り日数（既定 2027-03-12）\"]:::auto\n  AP2 --> S10[\"状態を 10『申請完了・採択待ち』→ 11『採択・入金待ち』へ手動\"]:::human\n  S10 --> R1[\"国保中央会など: 審査・決定\"]:::ext\n  R1 --> S11[\"採択の結果・振込を確認して入力<br/>申請ステータスと案件の状態は別々に手で更新\"]:::human\n  S11 --> AF[\"状態 12『アフターフォロー中』<br/>審査・決定確認（翌月）／振込確認（翌々月）／データ移行完了<br/>定着状況・満足度・次のアクション／消費税の仕入控除税額報告のメモ\"]:::human\n  AF --> CK{\"出荷の請求・入金・領収証が済んでいるか確認<br/>（『出荷・請求・入金』タブは読み取り専用）\"}:::check\n  CK --> S13[\"状態を 13『案件完了』へ手動<br/>出荷が入金済かなどのチェックはコードに無い\"]:::gap\n  LO[\"失注(4): どの段階からも手動<br/>理由（他社紹介／辞退／当日キャンセル／その他）が必須\"]:::human\n  S7 -.-> LO\n  S9 -.-> LO\n```\n\n---\n\n## 図D. 出荷・請求・入金・領収（現状＝実装済み）\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  D0[\"出荷 下書き(draft)<br/>見積の承諾で自動作成（shipType=direct・在庫扱い）<br/>または ABサークルへの直送発注の確定で作成（dropship・direct）\"]:::auto\n  D0 --> D1{\"事務局・供給担当: 内容を確認<br/>住所・数量・送料・金額調整<br/>『在庫から出すか／ABサークルへ発注か』の基準はコードに無い\"}:::gap\n  D1 --> AB{\"ABサークルへ発注する場合\"}:::check\n  AB -- はい --> AB1[\"人: 発注を下書き保存→『確定』<br/>自動: 発注書PDFをABサークルへメール\"]:::human\n  AB1 --> AB2[\"人: 入荷登録（入荷先の保管場所）<br/>自動: 在庫を加算（直送は入荷登録なし）\"]:::human\n  AB -- いいえ --> D2\n  AB2 --> D2\n\n  D2[\"人: 『発送済にする』を押す<br/>確認画面: 出荷日・出荷元の保管場所・レターパック種別<br/>『出荷指示を送らない（記録のみ）』チェック\"]:::human\n  D2 --> D3[\"押した瞬間に3つが同時に起きる（ボタン名とずれている）<br/>1 状態=発送済 / 2 在庫を引き落とす（不足なら止める）<br/>3 出荷指示をChat（OP_出荷依頼）に投稿\"]:::auto\n  D3 --> D3a[\"発送済になった印に 支払期限 net14 が付く<br/>（過去分は付かない）\"]:::auto\n  D3 --> C1[\"発送センター: Chatの出荷指示で発送<br/>（実際に発送したかの確認はシステムがしない）\"]:::ext\n  D3 --> L1[\"人: 宛名ラベル（A4・レターパックライト/プラス）<br/>送付状・追跡番号の写真登録\"]:::human\n\n  D3 --> I1[\"人: 『請求済にする』<br/>確認画面で発行日（既定は今日）・経理へ報告の有無\"]:::human\n  I1 --> I2[\"自動: 状態=請求済・期限を保存<br/>請求書PDFを作成→Storage保存→経理へメール添付＋Chat\"]:::auto\n  I2 --> I3[\"人: 請求書を事業所へメール送付（宛先・件名・本文を確認）<br/>申請ガイド・支援報告書を同封可（3つまで・約10MB）\"]:::human\n  I3 --> P1{\"人: 銀行の通帳で入金を確認<br/>自動突合は無い（運用）\"}:::gap\n  P1 --> P2[\"人: 『入金を記録する』金額・日付<br/>部分入金・過入金に対応・過入金は次回請求へ充当可\"]:::human\n  P2 --> P3[\"残額0で自動的に 入金済(paid)\"]:::auto\n  P3 --> R1[\"人: 領収証 明細・用途区分（A=カードリーダー／B=接続サポート等経費／X=対象外）<br/>警告は出るが保存・印刷は止めない\"]:::human\n  R1 --> R2[\"人: 『発行を記録』発行日=入金日（RCPT番号）<br/>領収証メールを事業所へ送付\"]:::human\n  R2 --> R3[\"ホームの『入金済で領収証未発行』の件数が減る\"]:::auto\n\n  OV[\"期限超過 → 催促メール（dun-ship）ボタンが出る\"]:::human\n  I3 -.-> OV\n  CN[\"キャンセル: 下書き・発送済・請求済のみ可（入金済は返金フロー）<br/>請求済のとき先方への取消連絡は人が行う<br/>下書きだけ削除可・在庫は戻る\"]:::human\n  D2 -.-> CN\n\n  DUE[\"支払期限の文書の食い違い: マニュアル本文は『請求月の翌月末』<br/>変更履歴は『請求書の発行日から14日』。コードは net14 優先→無ければ翌月末\"]:::gap\n  I2 -.-> DUE\n```\n\n### 図D'. 設計（案B・**未実装**）— 「出荷を依頼する」と「発送済にする」を分ける\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  N0[\"下書き(draft)\"]:::auto\n  N0 --> N1[\"人: 『出荷を依頼する』<br/>希望出荷日・出荷元・レターパック<br/>在庫不足は警告のみ\"]:::gap\n  N1 --> N2[\"依頼済(requested)<br/>自動: 出荷指示をChatに投稿（依頼者名つき）<br/>在庫はまだ引かない\"]:::gap\n  N2 --> N3[\"発送センター: 発送する\"]:::ext\n  N3 --> N4[\"人: 『発送済にする』発送日・追跡番号（任意）<br/>在庫を引き落とす（不足なら止める）・net14・押した人を記録<br/>出荷指示は投稿しない\"]:::gap\n  N2 --> N5[\"依頼を取り消す→下書きへ／出荷指示を再送<br/>取消の連絡は人が行う\"]:::gap\n  N0 --> N6[\"すでに届いている出荷: 『すでに発送済（記録のみ）』<br/>依頼を経ず発送済へ・出荷指示は送らない\"]:::gap\n```\n\n---\n\n## 図E. 毎日・随時の自動処理と通知の行き先\n\n```mermaid\nflowchart LR\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  subgraph EV[\"きっかけ\"]\n    E1[\"LP問い合わせ\"]:::auto\n    E2[\"見積もり作成\"]:::auto\n    E3[\"事業所の申込（承諾）\"]:::auto\n    E4[\"『発送済にする』\"]:::auto\n    E5[\"『請求済にする』\"]:::auto\n    E6[\"毎朝9:00 JST 日次まとめ（dailyFollowup）\"]:::auto\n    E7[\"毎朝6:30 JST アクセス解析（GA4・Search Console）\"]:::auto\n  end\n  subgraph CH[\"Googleチャットの行き先（設定で変更・停止できる）\"]\n    C1[\"CRM通知（TM_介護情報基盤普及推進室）\"]:::ext\n    C2[\"出荷指示（OP_出荷依頼）\"]:::ext\n    C3[\"経理\"]:::ext\n    C4[\"PM（介護情報基盤普及推進室_PM）\"]:::ext\n  end\n  E1 --> C1\n  E2 -. 設定が真のときだけ .-> C1\n  E3 --> C1\n  E4 --> C2\n  E5 --> C3\n  E6 --> C1\n  PMGAP[\"PMへの自動投稿のコードは見当たらない<br/>（設定項目とテスト送信だけ）。何をいつ受け取るかは運用\"]:::gap\n  C4 -.-> PMGAP\n  E7 --> DB[\"Firestore analyticsSummary / analyticsDaily\"]:::auto\n\n  subgraph DAILY[\"日次まとめの中身（該当があるときだけ・各最大10件）\"]\n    D1[\"未割当の新規案件（状態1・担当なし）\"]:::auto\n    D2[\"7日以上更新が無い（状態4・13以外）\"]:::auto\n    D3[\"申請期限30日以内で未申請（状態1,2,3,5〜9）\"]:::auto\n    D4[\"状態11で14日以上動かない\"]:::auto\n  end\n  E6 --> DAILY\n  DG[\"日次まとめの注意: 担当別には分けない／個人宛てやメールは無い／期限は 2027-03-12 固定（設定の変更は反映されない）<br/>画面の『担当が決まっていない案件』（状態3以降）とは範囲が違う／初期連絡の超過は含まれない\"]:::gap\n  DAILY -.-> DG\n```\n\n---\n\n## 図F. 権限（誰が何をできるか）\n\n```mermaid\nflowchart LR\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  L[\"ログイン: @tadakayo.jp のGoogleアカウント<br/>かつ users に登録・有効\"]:::auto\n  L --> V[\"viewer: 読むだけ<br/>サーバのルールが書き込みを拒否・画面は書込系ボタンを無効化\"]:::human\n  L --> S[\"staff: 案件・見積・出荷・請求・入金など全般を書ける<br/>案件の統合も可\"]:::human\n  L --> A[\"admin: staffと同じ書込権限＋<br/>案件の完全削除・設定・利用者・価格・パートナー管理・シミュレーター画面\"]:::human\n  P[\"認定事業者: partners に登録された人<br/>自分の発注（partnerOrders）だけ作れる\"]:::ext\n  X1[\"管理者専用は画面側の制限だけ<br/>設定の保存先 appConfig/settings はルール上 staff も書ける\"]:::gap\n  X2[\"Callable関数は『@tadakayo.jp か』だけ見るものが多い<br/>viewerを止めているのは notifyShipment（出荷指示）だけ\"]:::gap\n  A -.-> X1\n  V -.-> X2\n```\n\n---\n\n## 人が確認・判断する点の一覧（ここが抜けると止まる）\n\n| 工程 | 誰が | 何を確認・判断するか | システムの強制 |\n|---|---|---|---|\n| 受付 | 事務局 | 初期連絡（5営業日）／重複／既存案件への追記 | 画面の赤バッジのみ。通知なし。連絡の記録では解除されない |\n| 受注確定（電話・メール申込） | 事務局 | 申込を受けたら状態を3にする | 専用ボタンなし。出荷の下書きも作られない |\n| 担当決定 | 次田さん／事務局 | 誰に頼むか。Chatで依頼・調整→CRMの担当欄 | 担当は自動割り当て無し。担当への通知なし |\n| 承諾書 | 担当営業 | 署名が済んだか（目視）。伴走支援の前に取る | 状態を進めるゲートなし。署名完了の通知なし |\n| 出荷の下書き | 事務局・供給担当 | 在庫から／ABサークルの判断。住所・数量・送料 | 判断基準はコードに無い |\n| 発送済にする | 事務局・供給担当 | 実際に発送されたか | 押した瞬間に在庫引落しとChat投稿が走る（案B未実装） |\n| 請求 | 事務局・経理 | 発行日・経理への報告・メール送付 | 失敗しても請求済の記録は残る |\n| 入金 | 事務局・経理 | 通帳との照合。金額・日付の入力 | 自動突合なし |\n| 領収証 | 事務局・経理 | 明細・用途区分（A/B/X） | 警告のみ。止めない |\n| 書類・申請 | 担当営業 | 6項目の書類がそろったか。申請ガイドを同封するか | 状態は自動で動かない |\n| 案件完了 | 担当営業・管理者 | 出荷が入金済か。アフター終了か | チェックなし |\n\n## 図の限界（未確認として残した点）\n- 見積の `expired`（期限切れ）に自動で変える処理は見当たらない（画面の「期限切れ」表示のみ）。\n- 事業所マスタ（offices）は表示専用で、手で編集する画面は見つからなかった。\n- 認定事業者側の「納品確認」画面はコードに無い。\n- 支払期限の説明が文書で食い違っている（図Dの注記）。どちらが現行かは次田さんの確認待ち。\n- `SHIP_STATUS_JA`（case-detail.js）の中身と、見積承諾ページ（mitsumori.html）の画面の細部は読んでいない。\n- 運用（チャットでの担当調整など）は、この会話で読んだ範囲。台帳 §N と整合させて更新すること。\n";
const out=document.getElementById('out');

const nav=document.getElementById('nav');
out.querySelectorAll('h2').forEach((h,i)=>{h.id='s'+i;const a=document.createElement('a');a.href='#s'+i;a.textContent=h.textContent.split('（')[0].slice(0,14);nav.appendChild(a)});
mermaid.initialize({startOnLoad:false,theme:'default',flowchart:{htmlLabels:true,useMaxWidth:true,curve:'basis'},securityLevel:'strict'});
mermaid.run({querySelector:'.mermaid'}).then(()=>{document.title+=' OK'}).catch(e=>{document.title+=' ERR';console.error(e);const p=document.createElement('pre');p.textContent=String(e&&e.message||e);out.prepend(p)});
