const MD="# 介護情報基盤CRM 業務フロー図（改修後・2026-10-21 作業ツリーのコード）\n\n**位置づけ**: CRM 改善（ブランチ `crm-ship-request`・未コミットの作業ツリー）を実装したあとの「実際の動き」の図。正本はこの Markdown（Mermaid）。見やすい版・印刷版は `CRM業務フロー図_改修後_20261021.html`。\n**比較用**: 改修前の図 `CRM業務フロー図_20261021.md`（残してある）。違いは末尾の「改修前との違い」。\n**根拠**: 設計 `docs/CRM改善_設計_20261021.md`（§2〜§7・§12）と、実装 functions/index.js（acceptQuoteTransaction・staffAcceptQuote・reviseQuote・requireStaff・dailyFollowup・previewDailyFollowup・onCaseAssigned・onConsentSigned・notifyShipment）・functions/notify-text.mjs・accept-flow.js・accept-rules.js・admin/js/ship-flow.js・supply.js・supply-rules.js・ship-dup.js・bank-match.js・bank-import.js・case-detail.js・kanban.js・screen-rules.js・case-complete-check.js・quote-admin.js・users.js・settings.js・dashboard.js・firestore.rules・MANUAL.md を読み取り。\n**前提**: 本番には未反映（Functions → Hosting の順でデプロイ予定）。改修で触っていない部分（伴走支援当日・書類チェック・申請情報・領収証の中身など）は改修前の図の記述を引き継いだ（今回は読み直していない）。\n\n## 凡例（色と形）\n\n| 見た目 | 意味 |\n|---|---|\n| 黄色の四角 | **人が入力・操作する** |\n| 橙色のひし形 | **人が確認・判断する**（システムは止めない・強制しない。警告や確認ダイアログを出すものも含む） |\n| 青色の四角 | **システムが自動でやる**（改修で自動になった通知・判定・止める処理を含む） |\n| 灰色の四角 | 外部の人・サービス（事業所・Chat・Gmail・ABサークル・発送センター・銀行） |\n| 赤い点線の四角 | **コードに無い／運用に任されている／未実装**（人の記憶と声かけが頼り） |\n\n```mermaid\nflowchart LR\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n  H[\"人が入力・操作\"]:::human\n  C{\"人が確認・判断\"}:::check\n  A[\"システムが自動\"]:::auto\n  E[\"外部（事業所・Chat・銀行）\"]:::ext\n  G[\"運用／未実装\"]:::gap\n  H ~~~ C ~~~ A ~~~ E ~~~ G\n```\n\n---\n\n## 図0. 全体（受付から案件完了まで）\n\n案件のステータス（1〜13）を背骨に、並行して動く「出荷・請求・入金」の流れを右に置く。改修で増えた通知（担当決定・署名完了・日次まとめ）と、受注確定の2つ目の入口（電話・メールの申込）を足した。\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  subgraph IN[\"入口（案件ができる）\"]\n    I1[\"事業所: LP問い合わせ<br/>lp_inquiry\"]:::ext\n    I2[\"事業所: 見積ページ<br/>mitsumori_quote\"]:::ext\n    I3[\"事務局: 電話・メールを受けて手入力<br/>manual\"]:::human\n  end\n  I1 --> S1\n  I2 --> S2\n  I3 --> S1\n  S1[\"状態1 新規受信（担当なし）\"]:::auto\n  S2[\"状態2 確認中（見積を作ると1は自動で2へ）\"]:::auto\n  S1 --> F1{\"事務局: 初期連絡 5営業日以内<br/>超過は画面の赤バッジ＋毎朝の日次まとめに載る\"}:::check\n  F1 --> S2\n  S2 --> Q[\"見積もり作成・送付（図A）\"]:::human\n  Q --> AC[\"事業所: ウェブで申込（承諾）\"]:::ext\n  Q --> SAC[\"事務局: 電話・メール・FAXの申込を<br/>見積カードの『受注確定にする』で確定\"]:::human\n  AC --> S3[\"状態3 受注確定（1・2のときだけ3へ）<br/>自動: 出荷の下書きを作る／既存の下書き・依頼済は使い直す\"]:::auto\n  SAC --> S3\n  S3 --> AS{\"担当決定（Chatで調整→CRMの担当欄）<br/>図B\"}:::check\n  AS --> AN[\"自動: 担当へChatで通知（@メンション）\"]:::auto\n  AN --> S5[\"状態5 担当者決定（手動）\"]:::human\n  S5 --> CO[\"承諾書の署名・事前準備のご案内<br/>オンライン署名でChat通知（図B）\"]:::human\n  CO --> S6[\"状態6 事前準備中（訪問日を入力）\"]:::human\n  S6 --> S7[\"状態7 伴走支援待ち\"]:::human\n  S7 --> S8[\"状態8 伴走支援実施済<br/>図C\"]:::human\n  S8 --> S9[\"状態9 書類準備完了・申請ガイド中\"]:::human\n  S9 --> S10[\"状態10 申請完了・採択待ち\"]:::human\n  S10 --> S11[\"状態11 採択・入金待ち\"]:::human\n  S11 --> S12[\"状態12 アフターフォロー\"]:::human\n  S12 --> W13{\"完了にするとき取りこぼしの警告<br/>出荷・請求・入金・領収証・申請情報（止めない）\"}:::check\n  W13 --> S13[\"状態13 案件完了（completedAt を記録）\"]:::human\n\n  S3 -.->|\"出荷の下書き\"| SH\n  subgraph SP[\"出荷・請求・入金（供給管理）図D\"]\n    SH[\"出荷 下書き\"]:::auto --> SH1[\"人: 『出荷を依頼する』\"]:::human\n    SH1 --> SH2[\"依頼済 自動: 出荷指示をChatへ\"]:::auto\n    SH2 --> SH3[\"発送センターが発送\"]:::ext\n    SH3 --> SH4[\"人: 『発送済にする』在庫を引く\"]:::human\n    SH4 --> SH5[\"請求済 → 入金済（明細CSVの取り込み可）→ 領収証\"]:::human\n  end\n  W13 -.->|\"出荷の状態を読んで警告\"| SH5\n\n  LOST[\"失注(4)<br/>どの段階でも手動・理由が必須\"]:::human\n  S2 -.-> LOST\n  S5 -.-> LOST\n  LOST -.->|\"再申込が来たら3へ戻る\"| S3\n  S13 -.->|\"再申込が来たら3へ戻る\"| S3\n  GATE[\"状態の順序制限・前提条件のゲートは無い<br/>（承諾書が無くても進められる・任意の状態へ動かせる）\"]:::gap\n  S5 -.-> GATE\n```\n\n**全体の注意（コードで確認できたこと）**\n- ステータスの移動は**ほぼすべて手動**で、順序制限・前提条件のゲートは**今も無い**。自動で動くのは **1→2（見積の作成）** と **→3（Web 申込・電話受注の確定。1・2 のときだけ）**、**4・13→3（再申込で再開。`reopenedFrom`・活動「再申込で再開」を残す）**。3・5〜12 の案件に申込が来ても状態は据え置き。\n- 完了(13)だけは、出荷と申請情報を読んで**警告の確認ダイアログ**を出す（止めない。続行すると活動に「警告を確認のうえ完了: …」）。\n- 案件ステータス・申請ステータス・出荷の状態は今も**互いに連動しない**（完了の警告が読むだけ）。\n- 担当を自動で割り当てる処理は今も無い。担当を入れたら**本人に通知が飛ぶ**ようになった（図B）。\n\n---\n\n## 図A. 入口〜見積もり〜申込（受注確定）\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  subgraph LP[\"入口1: LP問い合わせ（改修なし）\"]\n    L1[\"事業所: フォーム送信<br/>ご希望=相談／見積／申込\"]:::ext\n    L1 --> L2{\"同じメール＋同じ事業所名で<br/>動いている案件がある?\"}:::auto\n    L2 -- はい --> L3[\"その案件に追記\"]:::auto\n    L2 -- いいえ --> L4[\"案件を新規作成 状態1・担当なし\"]:::auto\n  end\n  L3 --> N1\n  L4 --> N1\n  N1[\"自動: Chat（CRM通知）に投稿<br/>自動: 事務局あてメール\"]:::auto\n\n  subgraph MI[\"入口2: 見積ページ（改修なし）\"]\n    M1[\"事業所: 見積を作る\"]:::ext\n    M1 --> M2[\"自動: 案件 状態2（既存の状態1は2へ）<br/>見積 issued・有効30日・PDFをGmail\"]:::auto\n    M2 --> M4[\"Chat通知は設定の notifyQuoteChat が真のときだけ<br/>（既定は通知しない）\"]:::gap\n  end\n\n  subgraph MA[\"入口3: 手入力（改修なし）\"]\n    H1[\"事務局: 案件の新規登録\"]:::human\n    H1 --> H2[\"案件 状態1・担当なし<br/>Chat・メールは出ない\"]:::auto\n  end\n\n  N1 --> T{\"事務局: 初期連絡<br/>申込から5営業日以内\"}:::check\n  H2 --> T\n  T --> T2[\"電話・メールで確認 → 対応記録を手で追加\"]:::human\n  T -.->|\"超過したら\"| T4[\"自動: 画面の赤バッジ『超過N日』＋<br/>毎朝の日次まとめ（全体・担当別）に『初期連絡の超過』\"]:::auto\n  T4 -.-> T3[\"超過の判定は状態が1のままかだけ<br/>連絡した記録では解除されない（状態を2以降にすると消える）\"]:::gap\n\n  T2 --> V1[\"スタッフ: 見積カードで見積作成（staffCreateQuote）<br/>金額はサーバが再計算・状態1は自動で2へ\"]:::human\n  M2 --> V2\n  V1 --> V2[\"見積書を事業所へ送付／再送\"]:::human\n  V2 --> V3{\"内容を変えるか?\"}:::check\n  V3 -- はい --> V4[\"改版（reviseQuote）理由必須<br/>出荷が下書きのときだけ明細も作り直す<br/>依頼済なら止める（依頼を取り消してから）\"]:::human\n  V4 --> V2\n  V3 -- \"Webで申込\" --> AC1\n  V3 -- \"電話・メール・FAXで申込\" --> SA1\n\n  subgraph AC[\"受注確定 1: 事業所のWeb申込（acceptQuote）\"]\n    AC1[\"事業所: 見積ページで『申し込む』<br/>署名名・規約同意・届け先\"]:::ext\n    AC1 --> AC2{\"トークン一致・issued・有効期限内?\"}:::auto\n    AC2 -- いいえ --> AC3[\"拒否（受理済みは『already』で返す）\"]:::auto\n    AC2 -- はい --> AC4{\"自動（1回のトランザクションで）<br/>案件の出荷を読む\"}:::auto\n    AC4 -- \"下書き・依頼済がある\" --> AC5[\"その出荷を使い直す<br/>届け先・明細・支払方法・希望日を書き直す<br/>状態・番号・出荷元は据え置き\"]:::auto\n    AC4 -- \"発送済以降だけある\" --> AC6[\"新しい下書きを作る＋重複の印<br/>duplicateWarning・Chatに注記\"]:::auto\n    AC4 -- \"出荷なし\" --> AC7[\"新しい下書き SH-年-連番\"]:::auto\n  end\n\n  subgraph SA[\"受注確定 2: 電話・メール・FAXの申込（staffAcceptQuote）\"]\n    SA1[\"事務局: 見積カード『受注確定にする（電話・メールで申込を受けた）』<br/>最新版で issued のときだけ出るボタン<br/>申込者名・受付方法・受付日・支払方法・確認メールの要否・同じグループの事業所\"]:::human\n    SA1 --> SA2{\"自動: 権限 editor か（requireStaff）<br/>checkStaffAccept: 受理済み・旧版・期限切れ（受付日で比較）<br/>受付日が未来・名前なし・キャンセル以外の出荷あり → 拒否\"}:::auto\n    SA2 -- 通る --> SA3[\"自動: 出荷の下書きを作る<br/>見積 accepted（acceptedVia staff・同意は記録しない）<br/>受注日は既にあれば上書きしない\"]:::auto\n    SA3 --> SA4[\"自動: 確認メール（指定時・宛先は案件→見積の順）<br/>送れなかったら画面に理由を表示\"]:::auto\n  end\n\n  AC5 --> CS\n  AC6 --> CS\n  AC7 --> CS\n  SA3 --> CS\n  CS[\"自動: 案件の状態 1・2→3／3・5〜12は据え置き<br/>4・13→3（再申込で再開・reopenedFrom）／活動を記録\"]:::auto\n  CS --> CN[\"自動: Chat（CRM通知）に投稿<br/>申込者名・連絡先は載せない（電話受注）<br/>『在庫から発送かABサークルへ発注を選んで』\"]:::auto\n  CN --> Z[\"→ 図B 担当決定へ／図D 出荷へ\"]:::auto\n```\n\n**図Aの注意**\n- 電話受注は、案件に**キャンセル以外の出荷が1件でもあると拒否**する（「重複していないか確かめて」）。出荷の**使い直しは Web 申込だけ**。\n- Web 申込で使い直した出荷が**依頼済**のときは、Chat に「出荷指示は投稿済み。内容が変わる場合はセンターへ連絡」と注記が付く（センターへの連絡は人）。\n- 見積の期限切れ（`expired`）へ自動で変える処理は今も見当たらない（改修前と同じ）。\n\n---\n\n## 図B. 担当決定〜承諾書〜事前準備\n\n担当の調整は今も**Googleチャットでお願い・調整してから**CRMに入れる運用。改修で、担当を入れると**本人に Chat で通知**が飛び、承諾書に**オンライン署名が入ると通知**が飛ぶようになった。\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  A0[\"状態3 受注確定（担当なし）\"]:::auto\n  A0 --> N[\"ホーム『担当営業が決まっていない案件』（状態3以降）<br/>毎朝の日次まとめ全体にも同じ範囲で載る\"]:::auto\n  N --> D1{\"次田さん／事務局: 誰に頼むか判断<br/>場所・持ち件数・過去の担当\"}:::check\n  D1 --> D2[\"Chat で候補者に依頼・日程調整（スレッド）<br/>依頼・調整そのものは運用\"]:::gap\n  D2 --> D3{\"候補者: 引き受けるか返答\"}:::check\n  D3 -- はい --> D4[\"案件詳細『担当営業』を選ぶと即保存<br/>assignedBy・assignedAt を書く・活動『担当営業変更』\"]:::human\n  D3 -- いいえ --> D1\n  D4 --> D5[\"自動: onCaseAssigned<br/>CRM通知スペースに『担当営業が決まりました』<br/>担当を@メンション・設定した人の名前つき\"]:::auto\n  D5 --> D5a[\"自分で自分を担当にした→メンションしない<br/>担当を外した・統合での書き換え→投稿しない<br/>_notifyLog で1回だけ\"]:::auto\n  D5 -.-> D5g[\"Chat ID は管理者が利用者管理で入力<br/>未設定の人は『名前さん』の文字だけ（通知は届かない）<br/>画面以外で担当を変えると assignedAt が無く通知されない\"]:::gap\n  D4 --> D6[\"状態を手で 5『担当者決定』へ<br/>（担当を決めても状態は自動で動かない）\"]:::human\n\n  D6 --> K1[\"承諾書の署名（伴走支援を始める前の決まり）<br/>状態を進めるゲートは今も無い\"]:::gap\n  K1 --> K2[\"担当営業: 事前確認タブで『署名を依頼する』\"]:::human\n  K2 --> K3[\"渡し方: メール／二次元バーコード／URLコピー\"]:::human\n  K3 --> K4[\"事業所の確認者: consent.html（ログイン不要）<br/>名前入力・チェック→署名（web）\"]:::ext\n  K4 --> K6[\"自動: onConsentSigned（pending→signed・web）<br/>案件の活動に『承諾書にオンラインで署名されました』<br/>Chat（CRM通知）で担当を@メンション・確認者名は載せない<br/>担当が未割当なら『担当を決めてください』\"]:::auto\n  K2 --> K5[\"紙で取得した場合: 『紙で取得済みを記録』<br/>（通知は出ない・原本の保管はCRM外）\"]:::human\n  K6 --> K7{\"担当営業: 署名の内容を確認\"}:::check\n  K5 --> K7\n\n  D6 --> P1[\"担当営業: 事前準備のご案内メール（8項目）\"]:::human\n  P1 --> P2[\"送ると preGuideMailedAt を保存\"]:::auto\n  P1 --> P3[\"担当営業: 事前確認チェックリスト\"]:::human\n  P3 --> P4[\"担当営業: 訪問予定日を入力し<br/>状態を 6→7 へ手動\"]:::human\n```\n\n---\n\n## 図C. 伴走支援（当日）〜書類〜申請〜採択〜アフター〜完了\n\n当日・書類・申請の部分は改修なし（改修前の図から引き継ぎ）。変わったのは**完了(13)にするときの警告**と、**再申込での再開**。\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  S7[\"状態7 伴走支援待ち<br/>ホームに『伴走支援待ち』が出る\"]:::auto\n  S7 --> E1[\"伴走支援者: 当日チェックリスト<br/>初回利用登録→電子証明書→マイナアプリ→CR接続<br/>→介護WEB設定→動作確認→利用者周知\"]:::human\n  E1 --> E2{\"個人情報の取扱い3項目を確認\"}:::check\n  E2 --> E3[\"『実施の記録』: 実施日・実施者・区分\"]:::human\n  E3 --> S8[\"状態を 8『伴走支援実施済』へ手動\"]:::human\n\n  S8 --> D1[\"書類チェックタブ（6項目）\"]:::human\n  D1 --> D2[\"全部そろったか: 職員が確認<br/>チェックしても状態は自動で変わらない\"]:::gap\n  D2 --> S9[\"状態を 9 へ手動\"]:::human\n  S9 --> D3{\"申請ガイドを請求書・領収証メールに同封するか<br/>職員が判断\"}:::check\n\n  D3 --> AP1[\"事業所: 助成金の申請（申請の主体は事業所）\"]:::ext\n  AP1 --> AP2[\"担当営業: 『申請情報』タブに入力<br/>申請日・決定通知・振込確認日・交付額・不採択理由\"]:::human\n  AP2 --> S10[\"状態を 10→11 へ手動\"]:::human\n  S10 --> R1[\"国保中央会など: 審査・決定\"]:::ext\n  R1 --> S11[\"採択の結果・振込を確認して入力<br/>申請ステータスと案件の状態は別々に手で更新\"]:::human\n  S11 --> AF[\"状態 12『アフターフォロー中』\"]:::human\n  AF --> SEL[\"担当営業・管理者: 状態を 13 にする<br/>（案件詳細のセレクト／カンバンのドラッグ）\"]:::human\n  SEL --> WARN[\"自動: completionWarnings で確認<br/>出荷なし／未発送（下書き・依頼済）／請求書未発行<br/>入金未了（残額）／領収証未発行<br/>申請日未入力／助成金の入金日未記録／不採択\"]:::auto\n  WARN --> CK{\"警告があれば確認ダイアログ<br/>人が読んで続けるか決める（止めない）\"}:::check\n  CK -- やめる --> AF\n  CK -- 続ける --> S13[\"状態13 案件完了・completedAt を記録<br/>活動に『警告を確認のうえ完了: …』\"]:::auto\n  LO[\"失注(4): どの段階からも手動・理由が必須\"]:::human\n  S7 -.-> LO\n  S9 -.-> LO\n  S13 -.->|\"再申込が来たら（図A）\"| RE[\"状態3へ戻る・活動『再申込で再開（完了から）』\"]:::auto\n  LO -.->|\"再申込が来たら（図A）\"| RE\n```\n\n---\n\n## 図D. 出荷・請求・入金・領収（改修後＝二段階化を実装）\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  D0[\"出荷 下書き(draft)<br/>Web申込・電話受注で自動作成（在庫扱い）<br/>ABサークルへの直送発注の確定でも作成（direct・自社在庫を通らない）\"]:::auto\n  NEW[\"人: 出荷の新規登録<br/>既定は『登録して出荷を依頼する』（依頼済で登録）<br/>チェック『すでに発送済として登録』なら発送済で登録\"]:::human\n  PO[\"人: 認定事業者の受注から出荷を依頼<br/>依頼済で登録・受注は『受注確定』に\"]:::human\n\n  D0 --> DUP[\"自動: 重複の警告<br/>同じ案件に下書き・依頼済が2件以上<br/>サマリー『下書きの重複 n件』・行に『重複』・案件詳細に帯\"]:::auto\n  DUP --> DUP2[\"人: 残す出荷で『こちらを残す』<br/>ほかを理由『重複登録』で1件ずつキャンセル（削除しない）\"]:::human\n  D0 --> ADV[\"自動: 在庫の目安を行に表示（下書き・依頼済・自社在庫）<br/>例『在庫: 滋賀 3/2台・東京 0/2台』引き落としはしない\"]:::auto\n  D0 --> D1{\"事務局・供給担当: 内容を確認<br/>住所・数量・送料・金額調整\"}:::check\n  D1 -.-> D1g[\"『在庫から出すか／ABサークルへ発注か』の基準はコードに無い\"]:::gap\n  D1 --> AB{\"ABサークルへ発注する場合\"}:::check\n  AB -- はい --> AB1[\"人: 発注を下書き保存→『確定』<br/>自動: 発注書PDFをABサークルへメール\"]:::human\n  AB1 --> AB2[\"人: 入荷登録→自動: 在庫を加算（直送は入荷登録なし）\"]:::human\n  AB -- いいえ --> RQ\n  AB2 --> RQ\n\n  RQ[\"人: 『出荷を依頼する』<br/>希望出荷日・出荷元（自社在庫の品目があれば必須）・レターパック<br/>在庫不足は確認のうえ続行可・状態8以降なら『記録のみを使って』の注意\"]:::human\n  RQ --> RQ2[\"自動: トランザクションで『下書きのままか』を確認→依頼済(requested)<br/>requestedBy・requestedAt・requestSeq+1／在庫は動かさない\"]:::auto\n  NEW --> RQ2\n  PO --> RQ2\n  RQ2 --> NT[\"自動: notifyShipment 出荷指示をChat（出荷指示の投稿先）へ<br/>希望出荷日・依頼した人つき／投稿先が未設定・停止なら記録だけ<br/>shipNotifiedAt で二重投稿を防ぐ\"]:::auto\n  NT --> CTR[\"発送センター: Chatの出荷指示で発送\"]:::ext\n  RQ2 --> ED[\"人: 依頼済で送付先・数量を直す<br/>→『出荷指示を再送しますか？』\"]:::human\n  RQ2 --> RV[\"人: 『依頼を取り消す』→下書きへ<br/>投稿の印を消す（再依頼でまた投稿）・送信中60秒は不可\"]:::human\n  RV -.-> RVg[\"センターへの取り消しの連絡は人が行う<br/>（自動では取り消さない）\"]:::gap\n\n  CTR --> SC{\"人: センターが発送したのを確かめる<br/>（システムは実際の発送を確認しない）\"}:::check\n  SC --> MS[\"人: 『発送済にする』発送日・出荷元（変更可）・追跡番号（任意）\"]:::human\n  MS --> MS2[\"自動: トランザクションで『依頼済のままか・在庫が足りるか』を確認<br/>不足なら止める／発送済・在庫を引き落とす・net14・shippedBy<br/>出荷指示は投稿しない・認定事業者の受注は『出荷済』に\"]:::auto\n  D0 --> REC[\"人: 『すでに発送済（記録のみ）』<br/>依頼を経ず発送済へ・在庫を引く・出荷指示は送らない\"]:::human\n  REC --> MS2\n  MS2 --> L1[\"人: 宛名ラベル・送付状・追跡番号の写真登録\"]:::human\n\n  MS2 --> I1[\"人: 『請求済にする』発行日・経理へ報告の有無\"]:::human\n  I1 --> I2[\"自動: 請求済・支払期限を保存<br/>net14＝発行日+14日／それ以前の出荷は請求月の翌月末<br/>請求前に全額入金済なら入金済にする<br/>請求書PDF→経理へメール＋Chat\"]:::auto\n  I2 --> I3[\"人: 請求書を事業所へメール送付\"]:::human\n\n  I3 --> BK1[\"人: 銀行の入金明細CSVを用意し『入金明細を取り込む』<br/>文字コード自動判定・列の割り当て（プリセット保存）\"]:::human\n  BK1 --> BK2[\"自動: 照合（発送済・請求済で残額ありの出荷が候補）<br/>振込人コード=出荷番号の末尾4桁 +50・金額=残額 +40・名義の学習 +30<br/>コードと金額の両方が1対1のときだけ選択済み<br/>同じ日付・金額・名義が記録済みなら『取込済みの可能性』で選ばない\"]:::auto\n  BK2 --> BK3{\"人: 照合表を見て選ぶ・確かめる（確定は必ず人）\"}:::check\n  BK3 --> BK4[\"自動: 『選んだn件を入金として記録』<br/>出荷ごとに残額を計算し直す・bankTxns で同じ行は二度取り込めない<br/>発送済（未請求）は状態を変えない・名義を学習\"]:::auto\n  I3 --> P2[\"人: 『入金を記録する』手入力（部分・過入金・充当）\"]:::human\n  BK1 -.-> BKg[\"CSVを銀行から出すのは人・1回の振込で複数の請求は手で記録<br/>最初の銀行のCSV形式は未確定（設計§9-12）\"]:::gap\n  BK4 --> P3[\"残額0で自動的に 入金済(paid)\"]:::auto\n  P2 --> P3\n  P3 --> R1[\"人: 領収証 明細・用途区分（A／B／X）<br/>警告は出るが止めない\"]:::human\n  R1 --> R2[\"人: 『発行を記録』・領収証メールを事業所へ\"]:::human\n\n  OV[\"期限超過 → 催促メール（dun-ship）ボタン\"]:::human\n  I3 -.-> OV\n  CN[\"キャンセル: 下書き・依頼済・発送済・請求済のみ<br/>返金していない入金があると不可（先に取り消すか返金）<br/>依頼済は在庫を戻さない・発送済以降（自社在庫）は戻す<br/>削除できるのは下書きだけ（在庫は動かない）\"]:::human\n  RQ2 -.-> CN\n```\n\n### 図D2. 出荷の状態と、押せる操作（`admin/js/ship-flow.js` の遷移表どおり）\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  DR[\"下書き draft<br/>在庫: 引いていない\"]:::auto\n  RQ[\"依頼済 requested<br/>在庫: 引いていない<br/>出荷指示: 投稿済み\"]:::auto\n  SH[\"発送済 shipped<br/>在庫: 引いた\"]:::auto\n  IV[\"請求済 invoiced\"]:::auto\n  PD[\"入金済 paid\"]:::auto\n  CX[\"キャンセル canceled\"]:::auto\n  DR -->|\"出荷を依頼する（投稿）\"| RQ\n  RQ -->|\"発送済にする（在庫を引く）\"| SH\n  DR -->|\"すでに発送済（記録のみ）\"| SH\n  RQ -->|\"依頼を取り消す\"| DR\n  SH -->|\"請求済にする\"| IV\n  SH -->|\"請求済にする・全額入金済なら\"| PD\n  IV -->|\"入金を記録・残額0\"| PD\n  DR -->|\"キャンセル（在庫は動かない）\"| CX\n  RQ -->|\"キャンセル（在庫は戻さない）\"| CX\n  SH -->|\"キャンセル（在庫を戻す・入金があれば不可）\"| CX\n  IV -->|\"キャンセル（在庫を戻す・入金があれば不可）\"| CX\n  DEL[\"削除は下書きだけ\"]:::human\n  DR -.-> DEL\n```\n\n---\n\n## 図E. 毎日・随時の自動処理と通知の行き先\n\n```mermaid\nflowchart LR\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  subgraph EV[\"きっかけ\"]\n    E1[\"LP問い合わせ\"]:::auto\n    E2[\"見積もり作成\"]:::auto\n    E3[\"事業所のWeb申込\"]:::auto\n    E3b[\"電話受注の確定（staffAcceptQuote）\"]:::auto\n    E8[\"担当が入った（onCaseAssigned）\"]:::auto\n    E9[\"承諾書にオンライン署名（onConsentSigned）\"]:::auto\n    E4[\"『出荷を依頼する』・再送\"]:::auto\n    E5[\"『請求済にする』\"]:::auto\n    E6[\"毎朝9:00 JST 日次まとめ（dailyFollowup）\"]:::auto\n    E7[\"毎朝6:30 JST アクセス解析\"]:::auto\n  end\n  subgraph CH[\"Googleチャットの行き先（設定で変更・停止できる）\"]\n    C1[\"CRM通知（TM_介護情報基盤普及推進室）\"]:::ext\n    C2[\"出荷指示（OP_出荷依頼）\"]:::ext\n    C3[\"経理\"]:::ext\n    C4[\"PM（介護情報基盤普及推進室_PM）\"]:::ext\n  end\n  E1 --> C1\n  E2 -.->|\"設定が真のときだけ\"| C1\n  E3 --> C1\n  E3b --> C1\n  E8 -->|\"担当を@メンション\"| C1\n  E9 -->|\"担当を@メンション\"| C1\n  E4 --> C2\n  E5 --> C3\n  E6 -->|\"全体1通＋担当ごとに1通\"| C1\n  PMGAP[\"PMへの自動投稿のコードは今も無い<br/>（設定項目とテスト送信だけ）。設定画面に「自動投稿なし（将来用）」と注記済み\"]:::gap\n  C4 -.-> PMGAP\n  E7 --> DB[\"Firestore analyticsSummary / analyticsDaily\"]:::auto\n\n  subgraph DAILY[\"日次まとめの中身（各節10件まで・…ほか N 件）対象外の案件は全部除外\"]\n    O1[\"全体: 初期連絡が5営業日を超えた新規受信（状態1）\"]:::auto\n    O2[\"全体: 未割当の新規（状態1）\"]:::auto\n    O3[\"全体: 受注確定以降で担当なし（状態3,5〜13）\"]:::auto\n    O4[\"全体: 担当なしで7日以上更新なし（4・13以外）\"]:::auto\n    A1[\"担当別: 初期連絡の超過／新規受信のまま<br/>7日以上更新なし／入金待ち(11)14日以上<br/>申請期限30日以内の未申請（状態1,2,3,5〜9）\"]:::auto\n  end\n  E6 --> DAILY\n  DL[\"申請期限は設定値 subsidyDeadline（無ければ 2027-03-12）<br/>祝日の表にその年が無いと全体に警告を足す\"]:::auto\n  DAILY -.-> DL\n  DUPG[\"二重防止: _notifyLog に daily_日付／assign_イベント／consent_トークン<br/>日次まとめが1件も投稿せず失敗したら記録を消して再実行できる\"]:::auto\n  E6 -.-> DUPG\n  PV[\"管理者: 設定画面の『日次まとめのプレビュー』<br/>previewDailyFollowup（投稿しない）\"]:::human\n  PV -.-> DAILY\n  DG[\"担当ごとの1通も CRM通知スペースへの投稿（個人宛てのDM・メールではない）<br/>Chat ID 未設定の人はメンションにならない\"]:::gap\n  A1 -.-> DG\n```\n\n---\n\n## 図F. 権限（誰が何をできるか）\n\n```mermaid\nflowchart TD\n  classDef human fill:#FFF3C4,stroke:#B38600,color:#222\n  classDef check fill:#FFD9B3,stroke:#C2570C,color:#222\n  classDef auto fill:#D6E8FF,stroke:#2F6DB5,color:#222\n  classDef ext fill:#E6E6E6,stroke:#777,color:#222\n  classDef gap fill:#FFE5E5,stroke:#C0392B,stroke-dasharray:4 3,color:#222\n\n  L[\"ログイン: @tadakayo.jp のGoogleアカウント<br/>かつ users に登録・有効\"]:::auto\n  L --> V[\"viewer: 読むだけ<br/>ルールが書き込みを拒否・供給管理の操作ボタンと入金明細の取り込みは無効\"]:::human\n  L --> S[\"staff: 案件・見積・出荷・請求・入金・入金明細の取り込みを書ける\"]:::human\n  L --> A[\"admin: staffの権限＋<br/>設定（appConfig）・利用者（Chat ID 含む）・日次まとめのプレビュー・完全削除\"]:::human\n  P[\"認定事業者: partners に登録された人<br/>自分の発注（partnerOrders）だけ作れる\"]:::ext\n\n  R1[\"ルール: appConfig は読むのは登録者・書くのは管理者だけ<br/>_notifyLog は読むのは管理者・書くのは Functions だけ<br/>bankTxns・bankConfig は editor が書ける\"]:::auto\n  A -.-> R1\n  R2[\"Callable の共通認可 requireStaff（users の登録・有効・ロール）<br/>editor: staffAcceptQuote・reviseQuote・resendQuoteMail・staffCreateQuote<br/>saveQuotePdf・sendCaseEmail・sendSupplierOrder・sendPartnerMail<br/>reportInvoiceToAccounting・aiAssist<br/>admin: testChatNotify・previewDailyFollowup・collectAnalyticsNow<br/>notifyShipment は同等の判定を自前で持つ\"]:::auto\n  S -.-> R2\n  V -.-> R2\n  G1[\"デプロイ時の前提（未確認）: aiAssist の実行SAに Firestore 読み取り権限<br/>トリガー2本の region と Firestore の場所・Eventarc の権限\"]:::gap\n  R2 -.-> G1\n```\n\n---\n\n## 人が確認・判断する点の一覧（改修で変わったこと／まだ人に任されていること）\n\n| 工程 | 誰が | 何を確認・判断するか | 改修で強制される・通知されるようになったこと | まだ人に任されていること |\n|---|---|---|---|---|\n| 受付 | 事務局 | 初期連絡（5営業日）／重複／既存案件への追記 | 超過が**毎朝の日次まとめ**（全体と担当別）に載る | 連絡の記録では超過が解除されない（状態を2以降にする）。即時の通知は無い |\n| 受注確定（電話・メール・FAX） | 事務局 | 申込を受けたら確定する | **専用ボタン**（受付日で期限を判定・受理済み/旧版/出荷あり等は拒否）・出荷の下書きを自動作成・Chat・確認メール | 申込を受けたことを人がCRMに入れる。出荷が既にある案件は先に整理 |\n| Web申込の重複 | （自動） | 同じ案件に2回目の申込 | 下書き・依頼済を**使い直す**。発送済以降だけなら重複の印＋Chat注記 | 依頼済を使い直したときのセンターへの連絡 |\n| 失注・完了の案件への再申込 | （自動） | ― | 状態3へ戻し、活動「再申込で再開」 | 戻った案件の担当・段取りの見直し |\n| 担当決定 | 次田さん／事務局 | 誰に頼むか。Chatで依頼・調整→CRMの担当欄 | 担当を入れると**本人へChat通知**（@メンション）。日次まとめに未割当（状態3以降）が載る | 依頼・調整そのもの。Chat ID の登録（管理者）。状態5への移動 |\n| 承諾書 | 担当営業 | 署名が済んだか。伴走支援の前に取る | オンライン署名で**活動に記録＋Chat通知** | 状態を進めるゲートは無い（承諾書が無くても進められる）。紙の記録は通知なし |\n| 出荷の下書き | 事務局・供給担当 | 在庫から／ABサークルの判断。住所・数量・送料 | **重複の警告**と「こちらを残す」、**在庫の目安**の表示 | 在庫かABサークルかの判断基準はコードに無い |\n| 出荷を依頼する | 事務局・供給担当 | 希望出荷日・出荷元・レターパック | 出荷元を**必須**に。2人同時でも依頼は1回。出荷指示をChatへ | 在庫不足は警告のみ（続行できる） |\n| 発送済にする | 事務局・供給担当 | センターが実際に発送したか | 依頼済のままか・在庫が足りるかを**トランザクションで確認**（不足なら止める）。同時押しで二重に引かない | 実際に発送したかの確認は人 |\n| 依頼の取り消し・修正 | 事務局・供給担当 | 取り消すか・直すか | 送信中は止める。直したら**再送を聞く** | センターへの取り消し・変更の連絡は人 |\n| 請求 | 事務局・経理 | 発行日・経理への報告・メール送付 | 期限を保存（net14／翌月末）。請求前に全額入金なら入金済に | 事業所へのメール送付 |\n| 入金 | 事務局・経理 | 通帳・明細との照合 | **入金明細CSVの取り込み**で候補を出す（1対1で確かなものだけ選択済み）・同じ行は二度取り込めない | CSVを出す・照合表で選ぶ・確定は人。1振込で複数請求は手で記録 |\n| キャンセル | 事務局 | 取り消すか | 返金していない入金があると**キャンセル不可**。依頼済は在庫を戻さない | 請求済のときの先方への連絡 |\n| 領収証 | 事務局・経理 | 明細・用途区分（A/B/X） | （改修なし） | 警告のみ。止めない |\n| 書類・申請 | 担当営業 | 6項目の書類・申請ガイドの同封 | （改修なし） | 状態は自動で動かない |\n| 案件完了 | 担当営業・管理者 | 出荷が入金済か。申請・助成金の入金は済んだか | **完了の警告**（8項目）を確認ダイアログで出し、続行の記録を残す | 警告は止めない。続けるかは人が決める |\n\n## 改修前との違い\n\n| 場所 | 改修前（`CRM業務フロー図_20261021.md`） | 改修後（この図） | 根拠 |\n|---|---|---|---|\n| 出荷の段階 | 「発送済にする」を押すと、発送済・在庫引き落とし・出荷指示の投稿が同時に起きた | 「出荷を依頼する」（投稿・在庫は動かさない）→ センター発送 →「発送済にする」（在庫を引く）の2段階。「すでに発送済（記録のみ）」「依頼を取り消す」を追加。「出荷指示を送らない」チェックは廃止 | ship-flow.js・supply.js `requestDraftShipment`・`shipWithStock`・`revertToDraft` |\n| 出荷の新規登録 | その場で発送済 | 既定は依頼済で登録。チェックで発送済 | supply.js `saveShip` |\n| 在庫のバグ | 下書きの削除で在庫が増える／下書きの数量変更で在庫が動き確定で再度引く／同時押しで二重に引く | 在庫を戻す・動かすのは `stockDeducted` が真のときだけ。発送済はトランザクションで確認 | ship-flow.js `stockDeducted`・`qtyDelta`、supply.js `deleteShipment`・`saveShipEdit` |\n| 電話・メールの申込 | 専用ボタンなし。状態を手で3にし、出荷の下書きも作られない | 見積カードの「受注確定にする」（staffAcceptQuote）。下書き作成・Chat・確認メール | quote-admin.js・index.js `staffAcceptQuote`・accept-rules.js |\n| Web申込の重複 | 申込のたびに下書きができた（重複の推定原因） | 生きている下書き・依頼済を使い直す。発送済以降だけなら重複の印 | accept-flow.js `planWebShipment` |\n| 申込と案件の状態 | 無条件に3へ | 1・2→3、3・5〜12は据え置き、4・13→3（再申込で再開） | accept-flow.js `caseStatusOnAccept` |\n| 担当の通知 | 無し | 担当を入れると本人へChat（@メンション） | index.js `onCaseAssigned`・notify-text.mjs |\n| 承諾書の署名 | 通知なし・目視 | オンライン署名で活動に記録＋Chat | index.js `onConsentSigned` |\n| 日次まとめ | 全体1通のみ・期限は2027-03-12固定・対象外を除外せず・初期連絡の超過なし | 全体1通＋担当ごとに1通、期限は設定値、対象外を除外、初期連絡の超過・受注確定以降の未割当を追加、二重防止、管理者のプレビュー | notify-text.mjs `classifyCases`・index.js `dailyFollowup`・`previewDailyFollowup` |\n| 完了(13) | チェックなし | 8項目の警告を確認ダイアログで出す（止めない）・completedAt | case-complete-check.js・case-detail.js・kanban.js |\n| 下書きの重複 | 気づく仕組みなし | サマリー・行・案件詳細に警告、「こちらを残す」 | ship-dup.js・supply.js・case-detail.js |\n| 在庫の目安 | なし | 下書き・依頼済の行に保管場所ごとの在庫 | ship-dup.js `stockAdvice` |\n| 入金の照合 | 通帳を見て手入力のみ | 入金明細CSVの取り込みで候補を出す（確定は人） | bank-match.js・bank-import.js・supply-rules.js |\n| 請求前の入金 | ― | 請求済にしたとき全額入金済なら入金済に。発送済でも入金の履歴を出す | supply-rules.js `invoicePatchOf`・ship-flow.js `shipActions` |\n| キャンセル | 下書き・発送済・請求済 | 依頼済も可。返金していない入金があると不可 | ship-flow.js `canCancel` |\n| 支払期限の説明 | マニュアル本文と変更履歴が食い違い | MANUAL.md は「請求書に印字された期限と同じ（発行日から14日／それ以前は請求月の翌月末）」にそろえた | MANUAL.md |\n| appConfig | ルール上 staff も書けた | 書くのは管理者だけ（_notifyLog は Functions だけ） | firestore.rules |\n| Callable の認可 | 多くは「@tadakayo.jp か」だけ | requireStaff で登録・有効・ロールを確認 | index.js `requireStaff`・analytics.js |\n| Chat ID | なし | 利用者管理で管理者が入力（数字5〜30桁）・一覧に設定済／未設定 | users.js |\n\n## 図の限界（未確認として残した点）\n- **本番では未確認**。この図は作業ツリーのコードを読んだもの。トリガー2本（onCaseAssigned・onConsentSigned）の region・Eventarc の権限、aiAssist の実行 SA の Firestore 読み取り権限はデプロイ時の確認待ち（コードの注記どおり・未確認）。\n- **PMの投稿先**: 自動投稿のコードは今も無い。設定画面に「現在、CRMからの自動投稿はありません（将来用・テスト送信のみ）」と注記した（settings.js）。\n- **入金明細の最初の銀行**の CSV 形式は未確定（設計 §9-12 で次田さんから預かり待ち）。列の割り当て画面で対応する作り。\n- 電話受注の活動の件名を作る関数には「既存の下書きを使用」の文言があるが、電話受注は出荷がある案件を拒否するので、使われる経路はコード上見当たらない。\n- 担当別の日次まとめ・担当通知は、Chat ID が数字で登録されている人だけメンションになる。登録の件数（設計では既知23人）は本番データを見ていないので未確認。\n- 図C の当日・書類・申請、図D の領収証・宛名ラベル・催促メールなど改修で触っていない部分は、改修前の図の記述を引き継いだ（今回は読み直していない）。\n- 見積の `expired` へ自動で変える処理、事業所マスタの編集画面、認定事業者側の「納品確認」画面は、改修前と同じく見当たらない。\n- 運用（Chat での担当調整・センターとの連絡）は、コードと設計書から読める範囲。台帳と突き合わせて更新すること。\n";
