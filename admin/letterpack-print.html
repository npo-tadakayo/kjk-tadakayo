<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レターパックの宛名 — タダカヨ CRM</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <!-- レターパックの宛名印刷（2026-10-19 CRM改修 #4b）。
       A4 に印刷して、上半分の宛名枠を切ってレターパックに貼る。
       ライト＝青／プラス＝赤 をページ上で切り替え、選んだ種類は出荷（shipments.letterPackType）に保存する。
       @tadakayo.jp でログインした職員だけが開ける（supply-print と同じ認証ガード）。 -->
  <style>
    :root{--ink:#2C2416;--muted:#6a5e48;--line:#E8E4DC;--bg:#FAFAF8;--lp:#7a7468;}
    /* 種類で色を切り替える（未選択はグレー） */
    body.lp-light{--lp:#1E5BB8;}
    body.lp-plus{--lp:#E33535;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;font-size:14px;line-height:1.6;}
    .toolbar{position:sticky;top:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);z-index:10;}
    .btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:inherit;}
    .btn-print{background:#c02828;color:#fff;}
    .btn-back{background:var(--line);color:var(--ink);}
    .kind{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .kind-label{font-size:13px;color:var(--muted);}
    .kind input{position:absolute;opacity:0;pointer-events:none;}
    .kind label.opt{border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;}
    .kind label.opt.light{color:#1E5BB8;}
    .kind label.opt.plus{color:#E33535;}
    .kind input:checked + label.opt.light{border-color:#1E5BB8;background:#EAF1FB;}
    .kind input:checked + label.opt.plus{border-color:#E33535;background:#FDECEC;}
    .kind input:focus-visible + label.opt{outline:2px solid var(--ink);outline-offset:2px;}
    #saveMsg{font-size:12px;color:var(--muted);}
    #senderWrap{font-size:13px;display:none;}
    #senderWrap select{padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px;font-family:inherit;}
    /* 用紙（A4 縦）。画面でも印刷と同じ見た目 */
    .paper{width:210mm;min-height:297mm;margin:16px auto;background:#fff;border:1px solid var(--line);padding:10mm;}
    .loading{text-align:center;padding:60px;color:var(--muted);}
    .warn{max-width:210mm;margin:12px auto 0;padding:10px 14px;border-left:4px solid #c87a1f;background:#fff8ec;font-size:13px;}
    /* 宛名枠（2026-10-30 縦145mm × 横125mm に変更）。
       郵便局の依頼: レターパックの宛名面の枠に合わせ、上から お届け先 → ご依頼主 → 品名 の順で並べる（機械で読み取るため）。
       台数は品名の欄に大きく入れる。中身が多くても枠の大きさは変えない（overflow で切る＝はみ出して他所に掛からない） */
    .label{width:125mm;height:145mm;overflow:hidden;display:flex;flex-direction:column;border:2px solid var(--lp);border-radius:3mm;padding:3mm 4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .label-head{display:flex;justify-content:space-between;align-items:center;background:var(--lp);color:#fff;margin:-3mm -4mm 2.5mm;padding:1.5mm 4mm;border-radius:1.5mm 1.5mm 0 0;font-weight:700;font-size:11pt;letter-spacing:.05em;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .label-head small{font-size:8pt;font-weight:500;}
    .sec{display:inline-block;color:var(--lp);border:1.2px solid var(--lp);border-radius:1.5mm;font-size:8pt;font-weight:700;padding:0 2mm;margin-bottom:1mm;}
    .to{padding-bottom:2.5mm;border-bottom:1.2px dashed var(--lp);margin-bottom:2.5mm;}
    .zip{font-size:12pt;font-weight:700;letter-spacing:.08em;}
    .addr{font-size:12pt;line-height:1.35;margin:.5mm 0 1mm;word-break:break-all;}
    .org{font-size:11pt;line-height:1.35;}
    .name{font-size:16pt;font-weight:700;margin-top:.5mm;}
    .name .sama{font-size:11pt;font-weight:500;margin-left:2mm;}
    .tel{font-size:10.5pt;margin-top:1mm;}
    .from{font-size:9pt;line-height:1.45;padding-bottom:2.5mm;border-bottom:1.2px dashed var(--lp);margin-bottom:2.5mm;}
    .from .from-name{font-size:9.5pt;font-weight:700;}
    /* 品名の欄（枠の残りの高さを使う）。台数を大きく */
    .item{flex:1;display:flex;flex-direction:column;min-height:0;}
    .item .sec{align-self:flex-start;}
    .item-row{flex:1;display:flex;align-items:center;gap:4mm;}
    .item-name{flex:1;font-size:10pt;line-height:1.4;}
    .item-name b{font-size:11pt;}
    .item-qty{flex:0 0 auto;border:2.5px solid var(--ink);border-radius:2.5mm;padding:1mm 4mm;text-align:center;}
    .item-qty .num{font-size:48pt;font-weight:700;line-height:1.05;}
    .item-qty .num small{font-size:18pt;margin-left:1mm;}
    .item-so{font-size:8pt;color:var(--muted);text-align:right;}
    .cut{margin:6mm 0 4mm;border-top:1px dashed #999;position:relative;text-align:center;}
    .cut span{position:relative;top:-0.8em;background:#fff;padding:0 3mm;font-size:9pt;color:#777;}
    /* 梱包の確認（切り取り線の下・貼らない部分。2026-10-30 台数を目立たせる改修） */
    .pack{border:2.5px solid var(--ink);border-radius:3mm;padding:5mm 6mm;margin-bottom:5mm;}
    .pack-title{font-size:14pt;font-weight:700;margin-bottom:3mm;display:flex;justify-content:space-between;align-items:baseline;gap:4mm;flex-wrap:wrap;}
    .pack-title span{font-size:10pt;font-weight:500;color:var(--muted);}
    .pack-qty{display:flex;align-items:center;gap:6mm;background:#FFF4D6;border:2px solid #C87A1F;border-radius:3mm;padding:3mm 5mm;margin-bottom:4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pack-qty .big{font-size:40pt;font-weight:700;line-height:1;}
    .pack-qty .big small{font-size:16pt;margin-left:1mm;}
    .pack-qty .what{font-size:12pt;line-height:1.5;}
    .checks{list-style:none;margin:0;padding:0;font-size:13pt;}
    .checks li{display:flex;align-items:center;gap:4mm;padding:2mm 0;border-bottom:1px dashed var(--line);}
    .checks li:last-child{border-bottom:none;}
    .checks .box{width:8mm;height:8mm;border:2px solid var(--ink);border-radius:1mm;flex:0 0 auto;}
    .sign{display:flex;gap:8mm;margin-top:4mm;font-size:12pt;}
    .sign div{flex:1;border-bottom:1.5px solid var(--ink);padding-bottom:1mm;}
    @media (max-width: 820px){ .paper{width:auto;min-height:0;margin:12px 16px;padding:16px;} .label{width:100%;height:auto;min-height:145mm;} }
    @media print{
      @page{size:A4 portrait;margin:0;}
      .toolbar,.warn,.no-print{display:none !important;}
      body{background:#fff;}
      .paper{margin:0;border:none;width:210mm;min-height:auto;padding:10mm;}
      /* A4 の幅（約794px）は上の max-width:820px にも当たるので、宛名枠の寸法を印刷用に固定し直す */
      .label{width:125mm;height:145mm;min-height:0;}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="btn btn-back" href="/supply.html?tab=shipments" id="backBtn"><i class="ti ti-arrow-left" aria-hidden="true"></i> 出荷・請求・入金へ</a>
    <div class="kind" role="radiogroup" aria-label="レターパックの種類">
      <span class="kind-label">種類</span>
      <input type="radio" name="lpType" id="lpLight" value="light"><label class="opt light" for="lpLight">ライト（青）</label>
      <input type="radio" name="lpType" id="lpPlus" value="plus"><label class="opt plus" for="lpPlus">プラス（赤）</label>
      <span id="saveMsg" role="status" aria-live="polite"></span>
    </div>
    <label id="senderWrap">依頼主 <select id="senderSel"></select></label>
    <button class="btn btn-print" id="printBtn" type="button"><i class="ti ti-printer" aria-hidden="true"></i> 印刷</button>
  </div>
  <div id="warnBox" class="warn" style="display:none"></div>
  <div class="paper">
    <div class="loading" id="loadingEl"><i class="ti ti-loader-2 ti-spin" aria-hidden="true"></i> 読み込み中...</div>
    <div id="body" style="display:none"></div>
  </div>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/letterpack-print.js" type="module"></script>
</body>
</html>
