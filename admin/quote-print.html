<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>見積書 — タダカヨ CRM</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    :root{--color-ink-muted:#6a5e48;--color-border:#E8E4DC;--color-bg:#FAFAF8;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--color-bg);color:#2C2416;font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;font-size:13px;line-height:1.7;}
    .toolbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid var(--color-border);z-index:10;}
    .btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;min-height:44px;}
    .btn-print{background:#c02828;color:#fff;}
    .btn-secondary{background:#fff;border:1px solid var(--color-border);color:#2C2416;}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .loading{text-align:center;padding:60px;color:var(--color-ink-muted);}
    .info{max-width:210mm;margin:14px auto 0;font-size:12.5px;color:var(--color-ink-muted);padding:0 6px;}
    .doc-wrap{padding:20px 0 60px;}
    @media print{
      .toolbar,.info{display:none !important;}
      body{background:#fff;}
      .doc-wrap{padding:0;}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="btn btn-secondary" href="#" id="backBtn"><i class="ti ti-arrow-left" aria-hidden="true"></i> 案件詳細へ</a>
    <div class="toolbar-actions">
      <a class="btn btn-secondary" id="groupBtn" href="#" target="_blank" rel="noopener" style="display:none"><i class="ti ti-building-community" aria-hidden="true"></i> 合計見積書（法人まとめ）</a>
      <button class="btn btn-secondary" id="printBtn" type="button"><i class="ti ti-printer" aria-hidden="true"></i> 印刷／PDF保存</button>
      <button class="btn btn-secondary" id="saveOnlyBtn" type="button"><i class="ti ti-device-floppy" aria-hidden="true"></i> PDFを保存のみ</button>
      <button class="btn btn-print" id="sendBtn" type="button"><i class="ti ti-send" aria-hidden="true"></i> PDFを保存して事業所へ送付</button>
    </div>
  </div>
  <div class="info" id="infoLine"></div>
  <div class="doc-wrap">
    <div class="loading" id="loadingEl"><i class="ti ti-loader-2 ti-spin" aria-hidden="true"></i> 読み込み中...</div>
    <div id="docHost" style="display:none"></div>
  </div>

  <script src="/js/vendor/html2pdf.bundle.min.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
    import { gateRole } from "/js/role.js";
    import { QUOTE_DOC_STYLE, renderQuoteDocHtml, loadQuoteDocData, quoteDocPrintableClone } from "/js/quote-doc.js";

    // このページのCSSは quote-doc.js の QUOTE_DOC_STYLE を注入する（.est-doc と同じ体裁を作る側の唯一の正本）
    const styleEl = document.createElement("style");
    styleEl.textContent = QUOTE_DOC_STYLE;
    document.head.appendChild(styleEl);

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const functions = getFunctions(app, "asia-northeast1");
    const staffSaveQuotePdfFn = httpsCallable(functions, "saveQuotePdf");

    const params = new URLSearchParams(location.search);
    const quoteId = params.get("quote");

    let data = null; // { quote, kase, office, products }

    function setInfo(msg, tone) {
      const el = document.getElementById("infoLine");
      el.textContent = msg || "";
      el.style.color = tone === "error" ? "#b84a4a" : tone === "ok" ? "#1f7a4f" : "var(--color-ink-muted)";
    }

    async function buildPdfBase64() {
      for (let i = 0; i < 20 && typeof window.html2pdf !== "function"; i++) await new Promise((r) => setTimeout(r, 250));
      if (typeof window.html2pdf !== "function") throw new Error("PDFライブラリの読み込みに失敗しました");
      const { clone, cleanup } = quoteDocPrintableClone("docHost");
      try {
        const opt = { margin: 0, image: { type: "jpeg", quality: 0.95 },
          html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
          pagebreak: { mode: ["avoid-all", "css"] } };
        const dataUri = await window.html2pdf().set(opt).from(clone).outputPdf("datauristring");
        return String(dataUri).split(",")[1] || "";
      } finally { cleanup(); }
    }

    async function saveOrSend(mail) {
      if (!data) return;
      const btn = mail ? document.getElementById("sendBtn") : document.getElementById("saveOnlyBtn");
      const orig = btn.innerHTML;
      document.getElementById("sendBtn").disabled = true;
      document.getElementById("saveOnlyBtn").disabled = true;
      btn.innerHTML = '<i class="ti ti-loader-2 ti-spin" aria-hidden="true"></i> PDFを作成中...';
      setInfo("");
      try {
        const pdfBase64 = await buildPdfBase64();
        if (!pdfBase64) throw new Error("PDFの生成に失敗しました");
        btn.innerHTML = '<i class="ti ti-loader-2 ti-spin" aria-hidden="true"></i> 送信中...';
        const r = await staffSaveQuotePdfFn({ quoteId, pdfBase64, mail: !!mail });
        const d = r.data || {};
        if (d.status === "already") {
          setInfo("この見積もりはすでに送付済みです（再送は見積もりカードの「事業所へ再送」から行えます）。", "ok");
        } else if (mail) {
          setInfo(d.mailed ? "PDFを保存し、事業所へメールで送付しました。" : "PDFは保存しましたが、メール送付はできませんでした（宛先メールアドレスをご確認ください）。", d.mailed ? "ok" : "error");
        } else {
          setInfo("PDFを保存しました（メールは送っていません）。", "ok");
        }
      } catch (e) {
        setInfo(`失敗しました: ${e.message || e}`, "error");
      } finally {
        document.getElementById("sendBtn").disabled = false;
        document.getElementById("saveOnlyBtn").disabled = false;
        btn.innerHTML = orig;
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user || !user.email?.endsWith("@tadakayo.jp")) { location.href = "/index.html"; return; }
      if (!(await gateRole(db, user))) return;

      if (!quoteId) {
        document.getElementById("loadingEl").textContent = "パラメータが不正です（見積もりIDがありません）";
        return;
      }
      try {
        data = await loadQuoteDocData(db, quoteId);
      } catch (e) {
        document.getElementById("loadingEl").textContent = `読み込みに失敗しました: ${e.message || e}`;
        return;
      }
      if (!data || !data.quote) {
        document.getElementById("loadingEl").textContent = "見積もりが見つかりません";
        return;
      }

      const backBtn = document.getElementById("backBtn");
      if (data.quote.caseId) backBtn.href = `/case-detail.html?id=${encodeURIComponent(data.quote.caseId)}`;
      else backBtn.style.display = "none";

      document.getElementById("loadingEl").style.display = "none";
      const host = document.getElementById("docHost");
      host.style.display = "block";
      host.innerHTML = renderQuoteDocHtml(data);

      // 法人まとめの一部なら、合計見積書へのリンクを出す（所属は案件の quoteGroupId が正・無ければ見積もりの groupId）
      const gid = data.kase?.quoteGroupId || data.quote.groupId || "";
      if (gid) {
        const gb = document.getElementById("groupBtn");
        gb.href = `/quote-group-print.html?group=${encodeURIComponent(gid)}${data.quote.caseId ? `&case=${encodeURIComponent(data.quote.caseId)}` : ""}`;
        gb.style.display = "";
      }

      document.getElementById("printBtn").addEventListener("click", () => window.print());
      document.getElementById("saveOnlyBtn").addEventListener("click", () => saveOrSend(false));
      document.getElementById("sendBtn").addEventListener("click", () => saveOrSend(true));

      if (data.quote.pdfPath) {
        setInfo(data.quote.mailedAt ? "この版のPDFは保存済み・送付済みです。もう一度送ると再送になります。" : "この版のPDFは保存済みです。");
      }
    });
  </script>
</body>
</html>
