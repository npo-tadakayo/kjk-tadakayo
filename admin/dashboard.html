<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム — タダカヨ CRM</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/crm.css">
  <style>
    /* はじめての方へカード（rule08準拠・crm.css未追加分のみここに置く） */
    .onboarding-card .todo-row { align-items: flex-start; }
    .onboarding-card .todo-label { padding-top: 10px; }
    /* 右側の3ボタンは幅をそろえる（2026-09-14 次田さん指摘） */
    .onboarding-card .todo-open { min-width: 200px; justify-content: center; text-align: center; }
    .onboarding-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-top: var(--space-4);
    }
    .onboarding-manual-link { font-size: 13px; }
    .onboarding-manual-link a { color: var(--color-primary-dark); }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="app-name">タダカヨ CRM</div>
        <div class="app-sub">介護情報基盤伴走支援</div>
      </div>
      <nav class="sidebar-nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info" id="userEmail"></div>
        <button class="btn-logout" id="logoutBtn" type="button">
          <i class="ti ti-logout" aria-hidden="true"></i>ログアウト
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">ホーム</h1>
        <p class="page-intro" style="margin:4px 0 0">今日やることと、案件の状況をまとめて見る画面です。</p>
      </div>

      <div id="deadlineBanner" class="deadline-banner safe" style="display:none">
        <i class="ti ti-calendar-event" aria-hidden="true"></i>
        <span id="deadlineText"></span>
      </div>

      <div id="loadingEl" class="loading">
        <i class="ti ti-loader-2 ti-spin" aria-hidden="true"></i> 読み込み中...
      </div>

      <div id="dashContent" style="display:none">
        <!-- はじめての方へ（3ステップ・初回のみ／users/{自分}.onboardingDismissedAt が無いときだけ表示） -->
        <div id="onboardingCard" class="card onboarding-card" style="display:none;margin-bottom:20px">
          <div class="card-header"><strong>はじめての方へ — この画面の使い方は3つだけ</strong></div>
          <div class="card-body">
            <div class="todo-list">
              <div class="todo-row">
                <div class="todo-icon"><i class="ti ti-circle-number-1" aria-hidden="true"></i></div>
                <div class="todo-label">毎朝はホームを開く — 「今日やること」を上から順に片付けます</div>
                <a class="btn btn-secondary todo-open" href="#todoCard">今日やることへ</a>
              </div>
              <div class="todo-row">
                <div class="todo-icon"><i class="ti ti-circle-number-2" aria-hidden="true"></i></div>
                <div class="todo-label">案件は案件詳細で — 上に出る「次の一手」のとおりに進めます</div>
                <a class="btn btn-secondary todo-open" href="/cases.html">案件一覧を開く</a>
              </div>
              <div class="todo-row">
                <div class="todo-icon"><i class="ti ti-circle-number-3" aria-hidden="true"></i></div>
                <div class="todo-label">お金は出荷・請求・入金で — 行のボタンを左から順に押します</div>
                <a class="btn btn-secondary todo-open" href="/supply.html?tab=shipments">出荷・請求・入金を開く</a>
              </div>
            </div>
            <div class="onboarding-footer">
              <p class="onboarding-manual-link"><a href="/manual.html">くわしくはマニュアル §0 業務の流れ</a></p>
              <button type="button" id="onboardingDismissBtn" class="btn btn-secondary">わかりました（今後表示しない）</button>
            </div>
          </div>
        </div>

        <!-- 今日やること -->
        <div id="todoCard" class="card todo-card" style="margin-bottom:20px">
          <div class="card-header"><strong>今日やること</strong></div>
          <div class="card-body">
            <p class="todo-hint">上から順に片付けると業務が止まりません。</p>
            <div id="todoList" class="todo-list"></div>
          </div>
        </div>

        <!-- サマリー -->
        <div class="stat-grid" id="statGrid"></div>

        <!-- ファネル -->
        <div class="card" style="margin-top:20px">
          <div class="card-header"><strong>パイプライン（ファネル）</strong></div>
          <div class="card-body" id="funnelEl"></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px" id="breakdownGrid">
          <!-- フェーズ別（A1: 5フェーズ＋失注） -->
          <div class="card">
            <div class="card-header"><strong>フェーズ別</strong></div>
            <div class="card-body" id="statusBreakdown"></div>
          </div>
          <!-- 流入元別 -->
          <div class="card">
            <div class="card-header"><strong>流入元別</strong></div>
            <div class="card-body" id="sourceBreakdown"></div>
          </div>
        </div>

        <!-- 月次推移（B3） -->
        <div class="card" style="margin-top:20px">
          <div class="card-header"><strong>月次の新規案件（直近6か月）</strong></div>
          <div class="card-body" id="trendChart"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/sidebar.js"></script>

  <script src="/js/mobilenav.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/dashboard.js" type="module"></script>
</body>
</html>
